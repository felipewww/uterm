# Builds the macOS app (unsigned) on a macOS runner: node-pty is a native module and a .dmg can only be made on macOS.
# Run it from the Actions tab ("Run workflow"); the .dmg / .zip files appear as artifacts of the run.
name: Build macOS app
on: workflow_dispatch
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test
      - run: npm run build
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: uTerm-mac
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
