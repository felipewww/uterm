# OPTIONAL. uTerm needs no Docker: it has its own database, speech recognition and a system voice.
# This file only runs a Chatterbox text-to-speech server (more natural, cloneable voices). Start it with `docker compose up -d tts`,
# then choose "Chatterbox server" in Settings → Voice engines and enter http://127.0.0.1:18090.
name: echo-term

services:
  tts:
    build: ./services/tts
    restart: unless-stopped
    environment:
      TTS_DEVICE: ${TTS_DEVICE:-cpu}
      TTS_TORCH_THREADS: ${TTS_TORCH_THREADS:-6}
      HF_HOME: /models/hf
      VOICES_DIR: /voices
    ports:
      - "127.0.0.1:${TTS_PORT:-18090}:8090"
    volumes:
      - tts-models:/models
      - tts-voices:/voices
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

volumes:
  tts-models:
  tts-voices:
